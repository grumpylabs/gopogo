# Default values for gopogo.

image:
  repository: ghcr.io/grumpylabs/gopogo
  # Defaults to the chart appVersion, published by pushing the git tag
  # v<appVersion>. Use "latest" for the newest build of main.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Each replica is an independent cache; gopogo does not replicate or shard
# between instances.
replicaCount: 1

# Every enabled protocol is served on the same port; gopogo detects the
# protocol of each connection.
protocols:
  redis: true
  http: false
  memcache: false
  postgres: false

port: 6379

cache:
  # Bytes with a k/m/g/t suffix (e.g. 1GB), a percentage of the container
  # memory limit (e.g. 80%), or 0 for unlimited. With a percentage, set
  # resources.limits.memory so the cache evicts before the pod is OOM-killed.
  maxMemory: "80%"
  # Evict entries when full; false rejects writes instead.
  evict: true
  shards: 16
  # Hashmap load factor percent, 55-95.
  loadFactor: 75
  # Assign compare-and-swap tokens on every write (memcache cas, HTTP cas).
  cas: false
  sixpack: true
  autoSweep: true
  sweepInterval: 10s

maxConns: 1024

auth:
  # Require a password on every protocol. The password is stored in a Secret
  # created by the chart, unless existingSecret names one to use.
  enabled: false
  password: ""
  existingSecret: ""
  existingSecretKey: password

tls:
  # Serve TLS on tls.port in addition to the plain port. The Secret must hold
  # tls.crt and tls.key, and ca.crt to verify client certificates when
  # verifyClients is true.
  enabled: false
  port: 6380
  secretName: ""
  verifyClients: false

persistence:
  # Load the cache from a file at startup and save it at shutdown. Enabling
  # this deploys a StatefulSet with a PersistentVolumeClaim per replica.
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  # Saving on shutdown must finish within terminationGracePeriodSeconds.
  fileName: gopogo.pogo

telemetry:
  # OpenTelemetry metrics and traces.
  enabled: false
  # otlp or stdout
  exporter: otlp
  # Per-signal overrides: otlp, stdout or none; empty uses exporter. With
  # stdout, metrics and spans are JSON lines on the container's stdout. Logs
  # always use exporter.
  metricsExporter: ""
  tracesExporter: ""
  # OTLP protocol: grpc or http.
  protocol: grpc
  # host:port (e.g. otel-collector.observability:4317), or for OTLP/HTTP a
  # base URL such as https://ingest.example.com/src-abc; metrics and traces go
  # to <base>/v1/metrics and <base>/v1/traces. Empty uses
  # OTEL_EXPORTER_OTLP_ENDPOINT (set it in extraEnv) or localhost.
  otlpEndpoint: ""
  # Plaintext OTLP to a host:port endpoint; a URL endpoint's scheme decides.
  insecure: true
  # OTLP request headers from a Secret, e.g. a bearer token. The key's value
  # is key=value pairs, e.g. "Authorization=Bearer <token>":
  #   kubectl create secret generic gopogo-otlp \
  #     --from-literal=headers="Authorization=Bearer <token>"
  headersSecret:
    name: ""
    key: headers
  # deployment.environment.name resource attribute, e.g. stage or prod.
  environment: ""
  # The pod's k8s.pod.name, k8s.pod.uid, k8s.namespace.name, k8s.node.name,
  # k8s.container.name, k8s.statefulset.name (or k8s.deployment.name) and
  # service.instance.id are always set. Optional:
  # k8s.cluster.name, e.g. mini.
  clusterName: ""
  # service.namespace, grouping gopogo with related services.
  serviceNamespace: ""
  # Any other resource attributes, e.g. {"team": "cache", "cloud.region": "us-east-1"}.
  resourceAttributes: {}
  # Fraction of new traces to sample (0-1), e.g. 0.1. A caller's sampling
  # decision (HTTP traceparent) is always respected. Empty samples every
  # trace, unless extraEnv sets OTEL_TRACES_SAMPLER (and
  # OTEL_TRACES_SAMPLER_ARG), which then chooses the sampler.
  traceSampleRatio: ""

# Verbose logging, including every telemetry export and its result.
verbose: false
# debug, info, warn or error. debug logs a record per command (linked to its
# trace) and cache stats every 30s; with telemetry these become OTLP logs.
logLevel: info

# Extra command-line flags, e.g. ["--tcpnodelay=false"].
extraArgs: []
extraEnv: []

terminationGracePeriodSeconds: 60

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  annotations: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Loading a large persistence file happens before gopogo listens, so the
# startup probe allows up to failureThreshold * periodSeconds for it.
startupProbe:
  periodSeconds: 5
  failureThreshold: 60
livenessProbe:
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  periodSeconds: 5
  failureThreshold: 3

# Continuous load generator (gopogo-loadgen from the same image) driving this
# release over RESP with a mix of reads, writes, counters, expirations and a
# few deliberate errors. For exercising the cache and its telemetry.
loadgen:
  enabled: false
  rate: 100        # commands per second
  workers: 4       # connections
  keys: 10000      # key space size
  duration: "0"    # 0 runs until the Deployment is removed
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
