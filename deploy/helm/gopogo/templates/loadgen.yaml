{{- if .Values.loadgen.enabled }}
# Continuous load against this release's Service, for exercising the cache
# and its telemetry. Its pods carry their own name label, so the cache's
# Service never selects them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gopogo.fullname" . }}-loadgen
  labels:
    {{- include "gopogo.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gopogo.name" . }}-loadgen
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gopogo.name" . }}-loadgen
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: loadgen
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: loadgen
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/gopogo-loadgen"]
          args:
            - -addr={{ include "gopogo.fullname" . }}:{{ .Values.port }}
            - -rate={{ .Values.loadgen.rate }}
            - -workers={{ .Values.loadgen.workers }}
            - -keys={{ .Values.loadgen.keys }}
            - -duration={{ .Values.loadgen.duration }}
          {{- if .Values.auth.enabled }}
          env:
            - name: GOPOGO_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "gopogo.authSecretName" . }}
                  key: {{ include "gopogo.authSecretKey" . }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.loadgen.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
