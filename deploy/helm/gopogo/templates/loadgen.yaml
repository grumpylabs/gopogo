{{- $lg := .Values.loadgen | default dict }}
{{- if $lg.enabled }}
{{- /* Traced by default when telemetry is on; the default covers upgrades
     with --reuse-values that lack loadgen.telemetry. */}}
{{- $traced := and .Values.telemetry.enabled (ternary $lg.telemetry true (hasKey $lg "telemetry")) }}
# Continuous load against this release's Service, for exercising the cache
# and its telemetry. Its pods carry their own name label, so the cache's
# Service never selects them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gopogo.fullname" . }}-loadgen
  labels:
    {{- include "gopogo.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gopogo.name" . }}-loadgen
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gopogo.name" . }}-loadgen
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: loadgen
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: loadgen
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/gopogo-loadgen"]
          {{- /* Defaults for each value: upgrades with --reuse-values may lack them. */}}
          args:
            - --addr={{ include "gopogo.fullname" . }}:{{ .Values.port }}
            - --rate={{ if hasKey $lg "rate" }}{{ $lg.rate }}{{ else }}100{{ end }}
            - --workers={{ $lg.workers | default 4 }}
            - --keys={{ $lg.keys | default 10000 }}
            - --duration={{ $lg.duration | default "0" }}
            - --protocol={{ $lg.protocol | default "redis" }}
            {{- if $traced }}
            {{- $t := .Values.telemetry }}
            {{- /* Traces go where the server's do, so each operation's trace
                 holds the loadgen's spans and the server's beneath them. */}}
            - --telemetry
            - --traces-exporter={{ $t.tracesExporter | default $t.exporter | default "otlp" }}
            {{- with $t.protocol }}
            - --otlp-protocol={{ . }}
            {{- end }}
            {{- with $t.otlpEndpoint }}
            - --otlp-endpoint={{ . }}
            {{- end }}
            - --otlp-insecure={{ if hasKey $t "insecure" }}{{ $t.insecure }}{{ else }}true{{ end }}
            {{- with $t.environment }}
            - --telemetry-environment={{ . }}
            {{- end }}
            {{- if and (hasKey $t "traceSampleRatio") (not (kindIs "invalid" $t.traceSampleRatio)) }}
            {{- if ne (toString $t.traceSampleRatio) "" }}
            - --trace-sample-ratio={{ $t.traceSampleRatio }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- if or .Values.auth.enabled $traced }}
          env:
            {{- if .Values.auth.enabled }}
            - name: GOPOGO_LOADGEN_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "gopogo.authSecretName" . }}
                  key: {{ include "gopogo.authSecretKey" . }}
            {{- end }}
            {{- if $traced }}
            {{- with dig "headersSecret" "name" "" .Values.telemetry }}
            - name: GOPOGO_LOADGEN_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ dig "headersSecret" "key" "headers" $.Values.telemetry | default "headers" }}
            {{- end }}
            {{- include "gopogo.resourceEnv" (dict "ctx" . "loadgen" true) | nindent 12 }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml ($lg.resources | default (dict "requests" (dict "cpu" "50m" "memory" "32Mi") "limits" (dict "memory" "64Mi"))) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
