name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The "make" steps share a name on purpose: duplicate step names are what
      # receiver.githubreceiver.UseCheckRunID collided on (docs#1028).
      - name: make
        run: make build

      - name: make
        run: make vet

      - name: make
        run: make bench

      - name: test
        run: make test
