name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The two "make" steps share a name on purpose: duplicate step names are
      # what receiver.githubreceiver.UseCheckRunID collided on (docs#1028).
      - name: make
        run: make build

      - name: make
        run: make vet

      - name: test
        run: make test
