name: integration

# Runs pogocache's protocol tests (test/integration) against a live server.
# The job graph is deliberately richer than ci.yml (artifact hand-off, a
# matrix, an always-run summary) so it also exercises the GitHub webhook
# collector with workflow_job events of several shapes.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: make
        run: make build

      - uses: actions/upload-artifact@v7
        with:
          name: gopogo
          path: bin/gopogo
          retention-days: 1

  integration:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        protocol: [resp, memcache, http, postgres]
        include:
          - protocol: resp
            tests: ^TestRESP
          - protocol: memcache
            tests: ^TestMemcache
          - protocol: http
            tests: ^TestHTTP
          - protocol: postgres
            tests: ^TestPostgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/integration/go.sum

      - uses: actions/download-artifact@v8
        with:
          name: gopogo
          path: bin

      # Artifacts do not keep file modes.
      - name: chmod
        run: chmod +x bin/gopogo

      - name: make
        run: make integration-run INTEGRATION_RUN='${{ matrix.tests }}'

  summary:
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: results
        env:
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "integration: $INTEGRATION"
          test "$INTEGRATION" = success
